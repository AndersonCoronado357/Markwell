appId: com.markwell.app
productName: Markwell
copyright: © 2026 Markwell

directories:
  output: dist-installer
  buildResources: build

# Servidor propio de actualizaciones: la misma carpeta desde la que se descarga
# el instalador. `electron-updater` lee de ahí el latest.yml que genera este
# mismo build. Sin GitHub Releases de por medio.
publish:
  - provider: generic
    url: https://markwell.acmsy.com/descargas/

# Empaqueta la app ya compilada por electron-vite (carpeta out/).
files:
  - out/**
  - "!**/*.{map,md,ts}"

# Usa el Electron ya descomprimido en node_modules (evita que electron-builder
# tenga que descomprimir el zip, que falla en esta máquina por el bug de extract-zip).
electronDist: node_modules/electron/dist
# El binario de better-sqlite3 para Electron 41 (ABI 145) ya está colocado; no recompilar.
npmRebuild: false

asar: true
# Los binarios nativos no pueden cargarse desde dentro del asar → se desempaquetan.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sqlite-vec*/**"

# El icono se copia sin empaquetar para que el proceso main lo pueda pasar a
# BrowserWindow (icono de ventana y de barra de tareas) en la app instalada.
extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  # Se edita el .exe para grabarle el icono y los datos de versión. No se firma
  # (no hay certificado): `signtool` no encuentra nada que firmar y sigue.
  # Si la descarga de winCodeSign vuelve a fallar en esta máquina, poner esto
  # en false: el instalador conserva el icono igual, solo lo pierde Markwell.exe.
  signAndEditExecutable: true
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: Markwell-Setup-${version}.${ext}
